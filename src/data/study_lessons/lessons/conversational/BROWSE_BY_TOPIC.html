an?"},{"hanzi":"我不是美国人","pinyin":"wǒ bú shì Měiguó rén","english":"I am not American."},{"hanzi":"我是中国人","pinyin":"wǒ shì Zhōngguó rén","english":"I am Chinese."},{"hanzi":"你是中国人吗","pinyin":"nǐ shì Zhōngguó rén ma","english":"Are you Chinese?"},{"hanzi":"你呢","pinyin":"nǐ ne","english":"And you?"},{"hanzi":"李先生","pinyin":"Lǐ xiānsheng","english":"Mr. Li."},{"hanzi":"王小姐","pinyin":"Wáng xiǎojiě","english":"Miss Wang."},{"hanzi":"吴先生","pinyin":"Wú xiānsheng","english":"Mr. Wu."},{"hanzi":"这位","pinyin":"zhè wèi","english":"This person (polite classifier)."},{"hanzi":"美国人","pinyin":"Měiguó rén","english":"An American person."},{"hanzi":"中国人","pinyin":"Zhōngguó rén","english":"A Chinese person."},{"hanzi":"你不是美国人吗","pinyin":"nǐ bú shì Měiguó rén ma","english":"Aren't you American?"},{"hanzi":"你不是中国人","pinyin":"nǐ bú shì Zhōngguó rén","english":"You are not Chinese."},{"hanzi":"我不是中国人","pinyin":"wǒ bú shì Zhōngguó rén","english":"I am not Chinese."},{"hanzi":"你是美国人","pinyin":"nǐ shì Měiguó rén","english":"You are American."},{"hanzi":"我是","pinyin":"wǒ shì","english":"I am; it is me."}],"dialogue":[{"speaker":"A","hanzi":"你是美国人吗？","pinyin":"Nǐ shì Měiguó rén ma?","english":"Are you American?"},{"speaker":"B","hanzi":"不是，我是中国人。","pinyin":"Bú shì, wǒ shì Zhōngguó rén.","english":"No, I am Chinese."},{"speaker":"B","hanzi":"你呢？","pinyin":"Nǐ ne?","english":"And you?"},{"speaker":"A","hanzi":"我是美国人。","pinyin":"Wǒ shì Měiguó rén.","english":"I am American."}]},{"id":"speaking-languages","title":"Talking About Language Ability","primary_topic":"school-language","objectives":["Ask whether somebody speaks a language.","Describe your proficiency accurately and modestly."],"terms":[{"hanzi":"你会说英文吗","pinyin":"nǐ huì shuō Yīngwén ma","english":"Can you speak English?"},{"hanzi":"你会说普通话吗","pinyin":"nǐ huì shuō Pǔtōnghuà ma","english":"Can you speak Mandarin?"},{"hanzi":"会说","pinyin":"huì shuō","english":"Can speak; know how to speak."},{"hanzi":"不会说","pinyin":"bú huì shuō","english":"C e."},{"hanzi":"我不知道","pinyin":"wǒ bù zhīdào","english":"I do not know."},{"hanzi":"学院路在那儿","pinyin":"Xuéyuàn Lù zài nàr","english":"Xueyuan Road is over there."},{"hanzi":"长安街在这儿","pinyin":"Cháng'ān Jiē zài zhèr","english":"Chang'an Street is here."},{"hanzi":"长安街不在这儿","pinyin":"Cháng'ān Jiē bú zài zhèr","english":"Chang'an Street is not here."},{"hanzi":"学院路呢","pinyin":"Xuéyuàn Lù ne","english":"How about Xueyuan Road?"},{"hanzi":"不在那儿","pinyin":"bú zài nàr","english":"Not over there."},{"hanzi":"你知道长安街在哪儿吗","pinyin":"nǐ zhīdào Cháng'ān Jiē zài nǎr ma","english":"Do you know where Chang'an Street is?"},{"hanzi":"长安街呢","pinyin":"Cháng'ān Jiē ne","english":"And what about Chang'an Street?"}],"dialogue":[{"speaker":"A","hanzi":"请问，学院路在哪儿？","pinyin":"Qǐngwèn, Xuéyuàn Lù zài nǎr?","english":"Excuse me, where is Xueyuan Road?"},{"speaker":"B","hanzi":"在那儿。","pinyin":"Zài nàr.","english":"It is over there."},{"speaker":"A","hanzi":"长安街也在那儿吗？","pinyin":"Cháng’ān Jiē yě zài nàr ma?","english":"Is Chang’an Street also over there?"},{"speaker":"B","hanzi":"不，长安街在这儿。","pinyin":"Bù, Cháng’ān Jiē zài zhèr.","english":"No, Chang’an Street is here."}]},{"id":"wants-intentions","title":"Expressing Wants and Intentions","primary_topic":"daily-actions","objectives":["Use 想 and 要 for wants and intentions.","Decline an offer naturally."],"terms":[{"hanzi":"我想","pinyin":"wǒ xiǎng","english":"I would like to; I want to."},{"hanzi":"你想","pinyin":"nǐ xiǎng","english":"You would like to; you want to."},{"hanzi":"我不想","pinyin":"wǒ bù xiǎng","english":"I do not want to."},{"hanzi":"我想吃","pinyin":"wǒ xiǎng chī","english":"I want to eat."},{"hanzi":"我想喝一点东西","pinyin":"wǒ xiǎng hē yìdiǎn dōngxi","english":"I would like something to drink."},{"hanzi":"你想买什么","pinyin":"nǐ xiǎng mǎi shénme","english":"What do you want to buy?"},{"hanzi":"我想要一点茶","pinyin":"wǒ xiǎng yào yìdiǎn chá","english":"I would like a little tea."},{"hanzi":"你想不想","pinyin":"nǐ xiǎng bu xiǎng","english":"Do you want to (or not)? const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const search=document.querySelector('#search');
function render(){const q=search.value.trim().toLocaleLowerCase();
 const filtered=all.map(t=>({...t,terms:t.terms.filter(x=>[x.hanzi,x.pinyin,x.english,t.title].join(' ').toLowerCase().includes(q))})).filter(t=>!q||t.terms.length||t.title.toLowerCase().includes(q));
 if(!filtered.some(x=>x.id===selected))selected=filtered[0]?.id;
 document.querySelector('#nav').innerHTML=filtered.map(t=>`<button data-id="${esc(t.id)}" class="${t.id===selected?'active':''}">${esc(t.title)}<span class="tag">${t.terms.length} matching expressions</span></button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;render()}));
 const t=filtered.find(x=>x.id===selected);
 document.querySelector('#counter').textContent=`${filtered.length} topics · ${filtered.reduce((s,x)=>s+x.terms.length,0)} expressions shown`;
 if(!t){document.querySelector('#detail').innerHTML='<p>No matches. Try a different search term.</p>';return}
 document.querySelector('#detail').innerHTML=`<h2>${esc(t.title)}</h2><p class="subtitle">${esc(t.primary_topic)} · ${t.objectives.map(esc).join(' / ')}</p><h3>Core expressions</h3>${t.terms.map(x=>`<div class="item"><span class="c">${esc(x.hanzi)}</span><span class="p">${esc(x.pinyin)}</span><span class="e">${esc(x.english)}</span></div>`).join('')||'<p>No expressions match your search in this topic.</p>'}<h3>Practice conversation</h3>${t.dialogue.map(x=>`<div class="dialogue"><b>${esc(x.speaker)}</b> <span class="c">${esc(x.hanzi)}</span> <span class="p">(${esc(x.pinyin)})</span><div class="e">${esc(x.english)}</div></div>`).join('')}<p class="note">Practice conversations are independently assembled teaching examples. Review pronunciation and usage in context.</p>`;
}search.addEventListener('input',render);render();</script></body></html>
