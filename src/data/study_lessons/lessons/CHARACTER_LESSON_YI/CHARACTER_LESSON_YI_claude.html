<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinese character lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
:root{--bg:#f1f4f2;--surf:#fff;--ink:#14202b;--mut:#5a6873;--line:#d6dde0;--acc:#0e7a6b;--soft:#dcefea;--bad:#b3412f;--badsoft:#f7e4df;--hero:#10222b;--heroink:#e9f1ee;
--sans:"Instrument Sans",system-ui,sans-serif;--zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161b;--surf:#16222a;--ink:#e8eef0;--mut:#9db0b9;--line:#283840;--acc:#4cc3ae;--soft:#173a37;--bad:#e8826f;--badsoft:#3a211d;--hero:#0a1419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161b;--surf:#16222a;--ink:#e8eef0;--mut:#9db0b9;--line:#283840;--acc:#4cc3ae;--soft:#173a37;--bad:#e8826f;--badsoft:#3a211d;--hero:#0a1419;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
.zh{font-family:var(--zh);font-weight:700}
.py{color:var(--mut);font-size:.9em}
.nopy .py{display:none}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:var(--hero);color:var(--heroink);padding:clamp(28px,6vw,72px) clamp(20px,5vw,64px);display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,5vw,64px);align-items:center}
.hero .big{font-family:var(--zh);font-weight:700;font-size:clamp(120px,24vw,300px);line-height:1;color:#7fd8c6}
.hero .bigpy{text-align:center;font-size:1.4rem;letter-spacing:.04em;opacity:.8;margin-top:-6px}
.hero h1{font-size:clamp(1.8rem,4.2vw,3.2rem);line-height:1.1;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.hero .sub{font-size:1.2rem;opacity:.85;margin:0 0 16px}
.hero p{max-width:60ch;opacity:.85;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid currentColor;opacity:.85;white-space:nowrap}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:clamp(20px,4vw,56px);max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:28px 0;max-height:100vh;overflow:auto}
nav.toc a{display:block;padding:5px 12px;margin-left:-12px;border-left:2px solid var(--line);color:var(--mut);text-decoration:none;font-size:.92rem}
nav.toc a.on{border-color:var(--acc);color:var(--ink);font-weight:600}
.tools{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.tog{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;text-align:left}
main{padding:28px 0 80px;min-width:0}
section{padding:36px 0;border-top:1px solid var(--line)}
section:first-child{border-top:0}
h2{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em;line-height:1.2}
.lede{color:var(--mut);margin:0 0 22px;max-width:62ch}
h3{font-size:1.05rem;margin:0 0 4px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.principle{font-family:var(--zh);font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.6;border-left:4px solid var(--acc);padding:4px 0 4px 20px;margin:0 0 20px;max-width:56ch}
.take{margin:0 0 24px;max-width:62ch}
.map{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf)}
.row{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .zh{font-size:1.5rem}
.row.dim{opacity:.6}
.tag{font-size:.78rem;padding:2px 9px;border-radius:6px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.w{background:var(--badsoft)}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.f{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:3px 14px;font-size:.88rem}
.f[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--surf)}
.v .zh{font-size:2rem;line-height:1.2}
.v .m{font-weight:600;margin:6px 0 2px}
.v .n{color:var(--mut);font-size:.9rem;margin:6px 0 10px}
.pat{font-family:var(--zh);font-weight:700;font-size:1.7rem;line-height:1.3}
.slot{font-style:normal;color:var(--acc);border-bottom:2px solid var(--acc);padding:0 2px}
.ex{display:grid;gap:14px}
.ex .card{display:grid;grid-template-columns:1fr;gap:2px}
.ex .zh{font-size:1.5rem;line-height:1.4}
.ex .en{font-size:1.02rem}
.ex .ctx{color:var(--mut);font-size:.88rem;margin-top:8px}
.cmp{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cmp .head{font-family:var(--zh);font-size:1.8rem;font-weight:700}
.cmp .lim{font-size:.88rem;color:var(--mut);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.bars{margin-top:22px}
.bar{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;margin:10px 0}
.bar .zh{font-size:1.6rem;text-align:center}
.track{display:flex;height:34px;border-radius:8px;overflow:hidden;background:var(--line)}
.track>div{display:flex;align-items:center;padding:0 10px;font-size:.82rem;color:#fff;white-space:nowrap}
.a{background:var(--acc)}.c{background:#6b7c88}
.key{font-size:.85rem;color:var(--mut);display:flex;gap:16px;margin-left:60px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mis{display:grid;gap:12px}
.mis .card{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mis .x{color:var(--bad)}.mis .x s{text-decoration-thickness:1px}
.mis .ok{color:var(--acc)}
.mis small{display:block;font-weight:600;margin-bottom:2px}
.mis .why{grid-column:1/-1;color:var(--mut);font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px}
.q{margin-bottom:14px}
.q .pr{font-weight:600;margin:6px 0 12px}
.ch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left}
.ch button.right{border-color:var(--acc);background:var(--soft)}
.ch button.wrong{border-color:var(--bad);background:var(--badsoft)}
.ans{display:none;margin-top:10px;padding:10px 14px;background:var(--soft);border-radius:8px}
.q.open .ans{display:block}
.show{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:.88rem}
details{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
ul.plain{list-style:none;padding:0;margin:8px 0 0}
ul.plain li{padding:5px 0 5px 26px;position:relative}
ul.plain li::before{content:"○";position:absolute;left:0;color:var(--mut)}
ul.plain li.ok::before{content:"✓";color:var(--acc);font-weight:700}
.src{padding:10px 0;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.src .meta{color:var(--mut);font-size:.88rem}
footer{color:var(--mut);font-size:.85rem;padding:0 0 40px;max-width:62ch}
@media(max-width:820px){
.hero{grid-template-columns:1fr;text-align:left}
.layout{grid-template-columns:1fr;gap:0}
nav.toc{display:flex;gap:4px;overflow-x:auto;padding:8px 0;max-height:none;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);flex-wrap:nowrap;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
nav.toc a{border:0;margin:0;white-space:nowrap;border-radius:99px;padding:4px 12px}
nav.toc a.on{background:var(--soft)}
.tools{flex-direction:row;margin:0 0 0 8px}.tog{white-space:nowrap}
.row{grid-template-columns:1fr;gap:4px}
.mis .card{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

stitutional instructions.", "register": "formal/written", "teaching_note": "A means or manner prepositional phrase.", "provenance": "constructed", "source_ids": []}, {"id": "ex-07", "title": "Main focus of a course", "hanzi": "这门课以口语练习为主。", "pinyin": "Zhè mén kè yǐ kǒuyǔ liànxí wéi zhǔ.", "english": "This course focuses mainly on speaking practice.", "context": "Course description.", "register": "neutral-to-formal", "teaching_note": "Recognize the established subpattern as a unit.", "provenance": "constructed", "source_ids": []}]}, "contrasts": {"items": [{"id": "contrast-yong", "hanzi": "用", "pinyin": "yòng", "meaning_en": "Use; with", "example": {"hanzi": "用筷子吃饭", "pinyin": "yòng kuàizi chīfàn", "meaning_en": "Eat with chopsticks"}, "usage": "Natural with concrete instruments in ordinary speech.", "limitation": "Frequently conversational; not freely interchangeable with formal means-constructions."}, {"id": "contrast-yi", "hanzi": "以", "pinyin": "yǐ", "meaning_en": "By; by means of", "example": {"hanzi": "以这种方式", "pinyin": "yǐ zhè zhǒng fāngshì", "meaning_en": "In this way"}, "usage": "Often describes abstract means or manners.", "limitation": "Especially written/formal in instrumental use; concrete nouns are not categorically excluded."}, {"id": "contrast-yiwei", "hanzi": "以为", "pinyin": "yǐwéi", "meaning_en": "Think; assume", "example": {"hanzi": "我以为你不来了", "pinyin": "Wǒ yǐwéi nǐ bù lái le", "meaning_en": "I thought you weren't coming."}, "usage": "Often used when an expectation is contradicted.", "limitation": "That implication is common but not obligatory."}, {"id": "contrast-renwei", "hanzi": "认为", "pinyin": "rènwéi", "meaning_en": "Consider; hold the opinion", "example": {"hanzi": "我认为这个办法不错", "pinyin": "Wǒ rènwéi zhège bànfǎ búcuò", "meaning_en": "I think this approach is good."}, "usage": "Often for an assessment or opinion.", "limitation": "Does not inherently carry the same mistaken-expectation tendency."}, {"id": "contrast-juede", "hanzi": "觉得", "pinyin": "juéde", "meaning_en": "Feel; think", "example": {"hanzi": "我觉得很好", "pinyin": "Wǒ juéde hěn hǎo", "meaning_en": "I think it's good."}, "usage": "Common for subjective impressions.", "limitation": "Different usage emphasis from holding an argued opinion."}], "preference_vs_rule": {"statement": "In the instrumental-preposition subset of Sun Dejin’s corpus, abstract nouns followed 以 (yǐ) in 166 of 189 occurrences (about 88%) and 用 (yòng) in 146 of 319 (about 46%). Concrete-noun observations were 23 and 173 respectively. These are corpus-specific collocational preferences, not universal restrictions or contemporary language-wide frequency estimates.", "source_ids": ["src-sun"], "data": {"sample": "instrumental-preposition subset of approximately 2-million-character historical written corpus", "categories": [{"form_hanzi": "以", "form_pinyin": "yǐ", "abstract": 166, "concrete": 23}, {"form_hanzi": "用", "form_pinyin": "yòng", "abstract": 146, "concrete": 173}]}}}, "mistakes": {"items": [{"id": "m-01", "incorrect_inference": "Translate every occurrence of 以 (yǐ) as “using”.", "correction": "Identify the complete word or grammatical construction first.", "reason": "For instance, 所以 (suǒyǐ) is an established conjunction meaning “so; therefore”."}, {"id": "m-02", "incorrect_inference": "Apply 可 (kě) + 以 (yǐ) as a productive rule to form new modal verbs.", "correction": "Learn 可以 (kěyǐ) as one word.", "reason": "Historical lexicalization does not create a general productive beginner rule."}, {"id": "m-03", "incorrect_inference": "Treat 以为 (yǐwéi) as an unfilled 以 X 为 Y (yǐ X wéi Y) pattern.", "correction": "Differentiate lexicalized words and grammatical constructions.", "reason": "The modern verb is a lexical unit, whereas the pattern is a construction."}, {"id": "m-04", "incorrect_inference": "Assume 以为 (yǐwéi) *always* means a mistaken assumption.", "correction": "Interpret the discourse context.", "reason": "Often—but not invariably—suggests a contradicted assumption."}, {"id": "m-05", "incorrect_inference": "Swap 以 (yǐ) and 用 (yòng) in every sentence.", "correction": "Check register and noun collocations.", "reason": "Comparable English glosses do not imply unrestricted interchangeability."}]}, "historical": {"enabled": true, "intro": "Optional Classical Chinese reference. Pinyin shown is a modern Mandarin reading, not reconstructed ancient pronunciation.", "items": [{"id": "classical-01", "function_en": "Marks the thing transferred or handled; approximate overlap with some modern 把 (bǎ) constructions.", "hanzi": "秦亦不以城予赵。", "pinyin": "Qín yì bù yǐ chéng yǔ Zhào.", "translation_en": "Qin likewise did not give the cities to Zhao.", "explanation": "The phrase 以城 (yǐ chéng) identifies what would be given. The comparison with 把 (bǎ) is restricted to this kind of construction.", "source_ids": ["src-shiji"]}], "caution": "Do not treat classical 以 (yǐ) and modern 把 (bǎ) as generally synonymous or freely interchangeable."}, "practice": {"enabled": true, "questions": [{"id": "q-01", "kind": "comprehension", "prompt": "In 我以前住在北京 (Wǒ yǐqián zhù zài Běijīng), does the speaker refer to present or earlier residence?", "choices": [], "answer": "Earlier residence; current location is unspecified.", "explanation": "The temporal expression 以前 (yǐqián) points to an earlier period."}, {"id": "q-02", "kind": "selection", "prompt": "Which sounds natural for casual “eat with chopsticks”?", "choices": [{"hanzi": "用筷子吃饭", "pinyin": "yòng kuàizi chīfàn", "meaning_en": "Eat with chopsticks"}, {"hanzi": "以筷子吃饭", "pinyin": "yǐ kuàizi chīfàn", "meaning_en": "Unnatural as an everyday conversational phrasing"}], "answer": "用筷子吃饭 (yòng kuàizi chīfàn).", "explanation": "用 (yòng) is the ordinary choice with a concrete tool in this casual context."}, {"id": "q-03", "kind": "production", "prompt": "Translate “May I come in?” using 可以 (kěyǐ).", "choices": [], "answer": "我可以进去吗？(Wǒ kěyǐ jìnqù ma?)", "explanation": "The complete modal verb expresses permission."}]}, "s ro": "Additional report-specific material is stored here when present; no supplementary entries are needed for this lesson.", "items": []}}, "report_intake": {"reports": [], "material": []}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const S=D.sections||{},L=D.lesson||{},H=D.headword||{},M=D.metadata||{};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=s=>e(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const zh=(h,p)=>`<span class="zh">${e(h)}</span>${p?` <span class="py">${e(p)}</span>`:''}`;
const nice=s=>String(s||'').replace(/[_-]/g,' ').replace(/^./,c=>c.toUpperCase());
const pat=(s,py)=>e(s).replace(/\b([XY])\b/g,'<i class="slot">$1</i>');
const exBlock=x=>x?`<div>${zh(x.hanzi,x.pinyin)}<div>${t(x.meaning_en)}</div></div>`:'';
const R={};
const T={overview:['Overview','What this character does'],vocabulary:['Words','Learn complete words first'],constructions:['Patterns','Reusable formal constructions'],examples:['Sentences','Constructed teaching examples'],contrasts:['Compare','Easily confused neighbours'],mistakes:['Mistakes','Wrong inferences to avoid'],practice:['Practice','Check yourself'],writing:['Writing','Form, strokes and origin'],historical:['Classical','Optional historical reference'],sources:['Sources','Where the claims come from'],checklist:['Review','Editorial checklist'],extensions:['More','Supplementary material']};

R.overview=o=>`${o.core_takeaway?`<p class="take">${t(o.core_takeaway)}</p>`:''}
${o.one_minute_explanation?`<div class="card" style="margin-bottom:20px"><h3>In one minute</h3>${t(o.one_minute_explanation)}</div>`:''}
<div class="map">${(o.meaning_map||[]).map(m=>`<div class="row ${m.example?'':'dim'}">
<div>${m.example?zh(m.example.hanzi):'<span class="zh">古</span>'}${m.example?`<div class="py">${e(m.example.pinyin)}</div>`:''}</div>
<div><b>${t(m.function_en)}</b><div class="py">${m.example?t(m.example.meaning_en)+' · ':''}${t(m.evidence)}</div></div>
<span class="tag">${e(m.register)}</span></div>`).join('')}</div>
${o.independent_usage?`<p class="lede" style="margin-top:16px">${t(o.independent_usage)}</p>`:''}`;

R.vocabulary=v=>{const items=v.items||[],pr=[...new Set(items.map(i=>i.priority))].sort();
return `<div class="filters"><span class="py">Priority</span><button class="f" aria-pressed="true" data-p="">All</button>${pr.map(p=>`<button class="f" aria-pressed="false" data-p="${e(p)}">${e(p)}</button>`).join('')}</div>
<div class="grid" id="vgrid">${items.map(i=>`<div class="card v" data-p="${e(i.priority)}">${zh(i.hanzi)}<div class="py">${e(i.pinyin)}</div>
<div class="m">${t(i.meaning_en)}</div><div class="py">${e(i.part_of_speech)}</div><div class="n">${t(i.usage_note)}</div>
<div class="chips"><span class="tag">${e(i.register)}</span><span class="tag">${e(nice(i.lexical_status))}</span></div></div>`).join('')}</div>
${v.notes?`<p class="lede" style="margin-top:18px">${t(v.notes)}</p>`:''}`};

R.constructions=c=>`<div class="grid">${(c.items||[]).map(i=>`<div class="card"><div class="tag" style="display:inline-block;margin-bottom:8px">${e(i.category)}</div>
<div class="pat">${pat(i.pattern_hanzi)}</div><div class="py">${e(i.pattern_pinyin)}</div>
<p style="margin:10px 0 6px"><b>${t(i.function_en)}</b></p>${exBlock(i.example)}
<p class="py" style="margin:10px 0 0">${t(i.usage_note)} <i>(${e(i.register)})</i></p></div>`).join('')}</div>
${c.structural_note?`<p class="lede" style="margin-top:18px">${t(c.structural_note)}</p>`:''}`;

R.examples=x=>`${x.default_provenance?`<p class="lede">${t(x.default_provenance)}</p>`:''}<div class="ex">${(x.items||[]).map(i=>`<div class="card"><h3>${t(i.title)}</h3>
<div class="zh">${e(i.hanzi)}</div><div class="py">${e(i.pinyin)}</div><div class="en">${t(i.english)}</div>
<div class="ctx">${t(i.context)} · ${t(i.teaching_note)}</div><div class="chips" style="margin-top:8px"><span class="tag">${e(i.register)}</span></div></div>`).join('')}</div>`;

R.contrasts=c=>{const p=c.preference_vs_rule,cats=p?.data?.categories||[];
return `<div class="cmp">${(c.items||[]).map(i=>`<div class="card"><div class="head">${e(i.hanzi)}</div><div class="py">${e(i.pinyin)}</div><div><b>${t(i.meaning_en)}</b></div>
<div style="margin:8px 0">${exBlock(i.example)}</div><div style="font-size:.92rem">${t(i.usage)}</div><div class="lim">${t(i.limitation)}</div></div>`).join('')}</div>
${p?`<div class="card bars"><h3>Preference, not a rule</h3><p class="py" style="margin:0 0 12px">Instrumental use in a historical written corpus: abstract vs concrete nouns</p>
${cats.map(k=>{const tot=k.abstract+k.concrete,pa=Math.round(k.abstract/tot*100);return `<div class="bar"><span class="zh">${e(k.form_hanzi)}</span><div class="track" title="${tot} occurrences"><div class="a" style="width:${pa}%">${pa}% abstract (${k.abstract})</div><div class="c" style="width:${100-pa}%">${k.concrete}</div></div></div>`}).join('')}
<div class="key"><span><i class="a"></i>Abstract noun</span><span><i class="c"></i>Concrete noun</span></div>
<p style="margin:14px 0 0;font-size:.92rem">${t(p.statement)}</p></div>`:''}`};

R.mistakes=m=>`<div class="mis">${(m.items||[]).map(i=>`<div class="card"><div class="x"><small>Don’t</small><s>${t(i.incorrect_inference)}</s></div><div class="ok"><small>Do</small>${t(i.correction)}</div><div class="why">${t(i.reason)}</div></div>`).join('')}</div>`;

R.practice=p=>(p.questions||[]).map(q=>`<div class="card q"><span class="tag">${e(nice(q.kind))}</span><div class="pr">${t(q.prompt)}</div>
${(q.choices||[]).length?`<div class="ch">${q.choices.map(c=>`<button data-ok="${q.answer.includes(c.hanzi)}"><span class="zh">${e(c.hanzi)}</span><br><span class="py">${e(c.pinyin)}</span></button>`).join('')}</div>`:''}
<button class="show">Show answer</button><div class="ans"><b>${t(q.answer)}</b><div>${t(q.explanation)}</div></div></div>`).join('');

R.writing=w=>`<div class="grid"><div class="card"><h3>Forms</h3>${t(w.mapping_note)}</div><div class="card"><h3>Pronunciation</h3>${t(w.pronunciation_note)}</div></div>
${(w.pending_checks||[]).length?`<div class="card" style="margin-top:14px"><h3>Still to verify</h3><ul class="plain">${w.pending_checks.map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`:''}`;

R.historical=h=>`<details><summary>Show classical reference</summary><p class="lede" style="margin-top:12px">${t(h.intro)}</p>${(h.items||[]).map(i=>`<div class="card"><div class="zh" style="font-size:1.4rem">${e(i.hanzi)}</div><div class="py">${e(i.pinyin)}</div><p><b>${t(i.translation_en)}</b></p><p>${t(i.function_en)}</p><p class="py">${t(i.explanation)}</p></div>`).join('')}
${h.caution?`<p class="py" style="margin-top:12px">⚠ ${t(h.caution)}</p>`:''}</details>`;

R.sources=s=>`<div class="card">${(s.items||[]).map(i=>`<div class="src"><b>${t(i.claim)}</b><div class="meta">${t(i.author)}, ${t(i.title)}. ${t(i.publication)}</div>
<div class="meta">${e(nice(i.evidence_type))} · ${e(nice(i.verification_status))} · <a href="${e(i.url)}" target="_blank" rel="noopener">Open source</a></div><div class="meta">${t(i.scope_note)}</div></div>`).join('')}</div>
${s.editorial_status?`<p class="lede" style="margin-top:14px">${t(s.editorial_status)} ${t(s.licensing||'')}</p>`:''}`;

R.checklist=c=>{const it=c.items||[],n=it.filter(x=>x.passed).length;
return `<p class="lede">${n} of ${it.length} checks passed.</p><div class="card"><ul class="plain">${it.map(x=>`<li class="${x.passed?'ok':''}">${t(x.label)}</li>`).join('')}</ul></div>`};

R.extensions=x=>(x.items||[]).length?`<p class="lede">${t(x.intro)}</p><pre>${e(JSON.stringify(x.items,null,2))}</pre>`:'';

const order=['overview','vocabulary','constructions','examples','contrasts','mistakes','practice','writing','historical','sources','checklist','extensions'];
const keys=[...order.filter(k=>k in S),...Object.keys(S).filter(k=>!order.includes(k))];
let secs='',nav='';
keys.forEach(k=>{const d=S[k];if(!d||d.enabled===false)return;const fn=R[k]||(x=>`<pre>${e(JSON.stringify(x,null,2))}</pre>`);const body=fn(d);if(!body)return;
const [ti,su]=T[k]||[nice(k),''];secs+=`<section id="${k}"><h2>${ti}</h2><p class="lede">${su}</p>${body}</section>`;nav+=`<a href="#${k}">${ti}</a>`});
const I=D.intro||{};
document.title=`${H.hanzi||''} · ${L.title||'Lesson'}`;
document.getElementById('app').innerHTML=`
<header class="hero"><div><div class="big" aria-hidden="true">${e(H.hanzi)}</div><div class="bigpy py" style="color:inherit">${e(H.pinyin)}</div></div>
<div><h1>${t(L.title)}</h1><p class="sub">${t(L.subtitle)}</p><p>${t(L.description)}</p>
<div class="chips">${(L.tags||[]).map(x=>`<span class="chip">${e(x)}</span>`).join('')}${M.audience?`<span class="chip">${e(M.audience)}</span>`:''}</div></div></header>
<div class="layout"><nav class="toc" aria-label="Sections">${nav}<div class="tools"><button class="tog" id="tp">Hide pinyin</button><button class="tog" id="tt">Toggle theme</button></div></nav>
<main>${I.core_principle?`<blockquote class="principle" style="margin-top:12px">${t(I.core_principle)}</blockquote>`:''}
${I.lesson_focus?`<p class="take"><b>Focus.</b> ${t(I.lesson_focus)} ${t(I.learning_priority||'')}</p>`:''}
${secs}<footer>${M.status?`Status: ${e(M.status)}`:''}${M.date_reviewed?` · reviewed ${e(M.date_reviewed)}`:''}. ${t(M.license_note||'')}</footer></main></div>`;

document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.setAttribute('aria-pressed',x===b));
document.querySelectorAll('#vgrid .v').forEach(c=>c.hidden=b.dataset.p&&c.dataset.p!==b.dataset.p)});
document.querySelectorAll('.show').forEach(b=>b.onclick=()=>{const q=b.closest('.q');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'Hide answer':'Show answer'});
document.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{b.classList.add(b.dataset.ok==='true'?'right':'wrong');b.closest('.q').classList.add('open')});
const tp=document.getElementById('tp');tp.onclick=()=>{const h=document.body.classList.toggle('nopy');tp.textContent=h?'Show pinyin':'Hide pinyin'};
document.getElementById('tt').onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d==='dark'?'light':'dark'};
const links=[...document.querySelectorAll('nav.toc a')];
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+x.target.id))}),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
</script>
</body>
</html>
